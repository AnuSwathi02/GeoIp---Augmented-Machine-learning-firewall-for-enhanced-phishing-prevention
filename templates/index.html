<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phishing URL Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      background: linear-gradient(270deg, #f7971e, #ffd200, #a1c4fd, #c2e9fb, #ff758c, #ff7eb3);
      background-size: 1200% 1200%;
      animation: bgAnimation 30s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
    }

    @keyframes bgAnimation {
      0% { background-position: 0% 50%; }
      25% { background-position: 50% 50%; }
      50% { background-position: 100% 50%; }
      75% { background-position: 50% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Moving Glowing Top Banner */
    .glow-banner {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 0;
      position: absolute;
      top: 0;
      overflow: hidden;
      white-space: nowrap;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      color: #00ffff;
      letter-spacing: 2px;
    }

    .glow-banner span {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 15s linear infinite;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 500px;
      text-align: center;
      animation: fadeIn 1.5s ease;
      margin-top: 60px; /* so container isn't overlapped by banner */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #ccc;
      margin-bottom: 20px;
      transition: 0.3s ease;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 8px rgba(0,123,255,0.3);
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(45deg, #007bff, #00c6ff);
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(45deg, #0056b3, #00aaff);
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 500;
      display: none;
      word-wrap: break-word;
    }

    .safe {
      background: #e0ffe0;
      color: #207720;
      border: 2px solid #207720;
      animation: pulse 1.5s infinite alternate;
    }

    .phishing {
      background: #ffe6e6;
      color: #bb0000;
      border: 2px solid #bb0000;
      animation: pulseRed 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 10px rgba(50,205,50,0.5); }
      to { box-shadow: 0 0 20px rgba(50,205,50,0.9); }
    }

    @keyframes pulseRed {
      from { box-shadow: 0 0 10px rgba(255, 0, 0, 0.4); }
      to { box-shadow: 0 0 20px rgba(255, 0, 0, 0.9); }
    }

    .geo-flag {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="glow-banner">
    <span>🚨 Stay Vigilant! Paste a URL below to detect phishing threats in real-time! 🚨</span>
  </div>

  <div class="container">
    <h2>🔐 Real-Time Phishing URL Scanner</h2>
    <input type="text" id="urlInput" placeholder="Paste a URL to scan (e.g. https://suspicious-site.com)" />
    <button onclick="checkURL()">🔎 Check Now</button>

    <div id="loading" style="margin-top: 15px; display: none;">⏳ Scanning...</div>
    <div id="resultBox" class="result"></div>
    <div id="geoFlag" class="geo-flag"></div>
  </div>

  <script>
    function checkURL() {
      const url = document.getElementById("urlInput").value.trim();
      const resultBox = document.getElementById("resultBox");
      const loading = document.getElementById("loading");
      const geoFlag = document.getElementById("geoFlag");

      resultBox.style.display = "none";
      geoFlag.textContent = "";
      loading.style.display = "block";

      if (!url) {
        alert("Please enter a URL.");
        loading.style.display = "none";
        return;
      }

      fetch("http://127.0.0.1:5000/check_url", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ url: url }),
      })
      .then((res) => {
        if (!res.ok) {
          throw new Error('Server error. Please try again.');
        }
        return res.json();
      })
      .then((data) => {
        loading.style.display = "none";
        resultBox.style.display = "block";
        resultBox.className = "result " + (data.mlResult === "phishing" ? "phishing" : "safe");

        const icon = data.mlResult === "phishing" ? "🚨" : "✅";
        resultBox.innerHTML = `
          <strong>${icon} ${data.mlResult.toUpperCase()}</strong><br><br>
          <strong>URL:</strong> <a href="${data.url}" target="_blank" rel="noopener noreferrer">${data.url}</a><br>
          <strong>Country:</strong> ${data.country || "Unknown"}
        `;

        geoFlag.textContent = data.geoFlagged
          ? "⚠️ Alert: The URL originates from a flagged country."
          : "🟢 Country origin appears safe.";
      })
      .catch((error) => {
        loading.style.display = "none";
        resultBox.style.display = "block";
        resultBox.className = "result phishing";
        resultBox.textContent = `❌ Error: ${error.message}`;
      });
    }
  </script>
</body>
</html>
